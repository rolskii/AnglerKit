<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://media.base44.com/images/public/6a3f2458eb55a5d860886e35/569bf3a60_GrHeronRound.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="hsl(210, 66%, 29%)" />
    <link rel="apple-touch-icon" href="https://media.base44.com/images/public/6a3f2458eb55a5d860886e35/a805937d3_heron-icon-square.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HeronWise" />
    <title>HeronWise — Fish Like You Mean It</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme") || "system";
          var isDark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="splash">
      <img src="https://media.base44.com/images/public/6a3f2458eb55a5d860886e35/569bf3a60_GrHeronRound.png" alt="HeronWise" />
      <h1>HeronWise</h1>
      <p>Fish Smart. Fish Hard. Fish Like You Mean It.</p>
    </div>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: hsl(210, 14%, 93%);
        color: hsl(210, 58%, 15%);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
        transition: opacity 0.3s ease;
      }
      #splash img {
        width: 96px;
        height: 96px;
        border-radius: 9999px;
      }
      #splash h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      #splash p {
        margin: 0;
        font-size: 14px;
        opacity: 0.6;
      }
      html.dark #splash {
        background: hsl(215, 25%, 7%);
        color: hsl(215, 15%, 92%);
      }
      html.dark #splash img {
        filter: invert(1);
      }
      #splash.splash-hide {
        opacity: 0;
        pointer-events: none;
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
